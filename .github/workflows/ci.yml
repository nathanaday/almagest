name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      # Each system reports on its own; a failure on one cancels nothing on the other.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go vet ./...
      - run: go test ./...
