# Releases the plugin's version when main gets it. main takes changes only through a pull
# request from preview whose checks pass. Each push to main builds the binaries again, the
# same way on every machine, and stops when their bytes differ from the checksums that
# release/checksums.txt pins: the plugin's launcher installs only those bytes. When no
# release has this version yet, it attests the binaries, tags the commit, and publishes
# them. When the version is released already (a change to the docs, say), it stops there.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go vet ./...
      - run: go test ./...
      - run: make release

      - name: Check the binaries against the checksums the plugin pins
        run: |
          if ! diff -u release/checksums.txt build/release/checksums.txt; then
            echo "The build of main differs from release/checksums.txt. Set a new version with make version V=<version> on preview, and merge it."
            exit 1
          fi

      - name: Read the version, and whether it is released
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' .claude-plugin/plugin.json | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Version $version is released already, and main still builds its bytes; nothing to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest the build provenance
        if: steps.version.outputs.new == 'true'
        uses: actions/attest@v4
        with:
          subject-path: build/release/almagest-*

      - name: Tag the commit and publish the release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Almagest $VERSION" \
            --notes "The almagest binary of $VERSION for macOS and Linux. The agent plugin installs the one for your machine; see the README. Each file's sha256 is in checksums.txt, and \`gh attestation verify <file> --repo nathanaday/almagest\` checks its provenance." \
            build/release/almagest-* build/release/checksums.txt
