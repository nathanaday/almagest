# Publishes the binaries of a version when its tag is pushed. The release commit pins
# their sha256 in release/checksums.txt (make pin), and the agent plugin's launcher installs
# a binary only when it matches. This job builds them again from the tag, the same way,
# and publishes them only when every byte matches what the commit pins.
name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check that the tag is the plugin's version
        run: |
          version=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' .claude-plugin/plugin.json | head -1)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME is not the version $version of .claude-plugin/plugin.json."
            exit 1
          fi

      - run: go vet ./...
      - run: go test ./...
      - run: make release

      - name: Check the binaries against the checksums the commit pins
        run: |
          if ! diff -u release/checksums.txt build/release/checksums.txt; then
            echo "The build of $GITHUB_REF_NAME differs from release/checksums.txt. Run make pin on the release commit, then tag it again."
            exit 1
          fi

      - name: Attest the build provenance
        uses: actions/attest@v4
        with:
          subject-path: build/release/almagest-*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Almagest $GITHUB_REF_NAME" \
            --notes "The almagest binary of $GITHUB_REF_NAME for macOS and Linux. The agent plugin installs the one for your machine; see the README. Each file's sha256 is in checksums.txt, and \`gh attestation verify <file> --repo nathanaday/almagest\` checks its provenance." \
            --verify-tag \
            build/release/almagest-* build/release/checksums.txt
